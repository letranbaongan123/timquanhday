<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Theo dõi hành trình</title>

<style>

body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

.top{
  padding:18px;
  text-align:center;
  background:#111827;
}

iframe{
  width:100%;
  height:calc(100vh - 60px);
  border:none;
}

</style>

</head>
<body>

<div class="top">
  📍 Theo dõi vị trí mới nhất
</div>

<iframe id="map"></iframe>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {


  apiKey: "AIzaSyBlHodv8ISv9GrgAzIMQ2h5-wlS1_aiQdY",

  authDomain:
    "ketnoi-quanhday-bf2b6.firebaseapp.com",

  databaseURL:
    "https://ketnoi-quanhday-bf2b6-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "ketnoi-quanhday-bf2b6",

  storageBucket:
    "ketnoi-quanhday-bf2b6.firebasestorage.app",

  messagingSenderId:
    "482764895905",

  appId:
    "1:482764895905:web:69a99c1a042ba5a072a2e0"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const params =
  new URLSearchParams(window.location.search);

const id = params.get('id');

async function loadLocation(){

  const snapshot =
    await get(ref(db, 'locations/' + id));

  const data = snapshot.val();

  if(data){

    document.getElementById('map').src =
      `https://maps.google.com/maps?q=${data.lat},${data.lng}&z=17&output=embed`;

  }

}

loadLocation();

</script>
</body>
</html>
